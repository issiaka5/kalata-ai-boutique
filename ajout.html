<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KALATA SHOP – Ajouter un produit</title>
<style>
body{font:16px system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#f7f8f5;color:#14201a}
h1{font-size:22px;color:#0f7a37}label{display:block;font-weight:600;font-size:14px;margin-top:12px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #d6dad2;border-radius:10px;margin-top:4px;background:#fff}
.r{display:flex;gap:10px}.r>*{flex:1}
button{margin-top:16px;width:100%;background:#16a34a;color:#fff;border:0;border-radius:10px;padding:14px;font:700 16px inherit}
#out{font:14px ui-monospace,monospace;min-height:80px}.n{font-size:13px;color:#66706a;margin-top:6px}
.hid{display:none}
</style></head><body>
<h1>Ajouter un produit</h1>
<label>Type
<select id="t"><option value="a">Amazon (lien d'affiliation)</option><option value="x">AliExpress (je vends moi-même)</option></select></label>
<label>Nom du produit<input id="n" placeholder="Ex : Support voiture à gravité"></label>
<label>Emoji (si pas de photo)<input id="e" value="📦"></label>

<div id="A">
<label>Ton lien affilié Amazon<input id="u" placeholder="https://amzn.to/..."></label>
<label>Description courte (facultatif)<input id="d"></label>
<p class="n">Le lien doit contenir ton identifiant (SiteStripe). Ne choisis pas un article en précommande. Le prix n'est pas affiché : Amazon l'impose pour les prix qui changent.</p>
</div>

<div id="X" class="hid">
<div class="r"><label>Numéro (id)<input id="id" inputmode="numeric" value="19"></label>
<label>Catégorie<select id="c"><option value="0">Accessoires téléphone</option><option value="1">Maison & cuisine</option><option value="2">Auto & moto</option><option value="3">Gadgets électroniques</option></select></label></div>
<div class="r"><label>Prix d'achat ($)<input id="usd" inputmode="decimal" placeholder="6,58"></label>
<label>FCFA pour 1 $<input id="fx" inputmode="numeric" value="590"></label></div>
<div class="r"><label>Frais en plus (FCFA)<input id="fr" inputmode="numeric" value="0"></label>
<label>Marge (%)<input id="m" inputmode="numeric" value="70"></label></div>
<label><input type="checkbox" id="pro" style="width:auto;margin-right:8px">Afficher un ancien prix barré (+25 %)</label>
<p class="n" id="calc"></p>
</div>

<button id="g">Générer la ligne</button>
<label>Ligne à copier<textarea id="out" readonly rows="4"></textarea></label>
<button id="cp">Copier</button>
<p class="n" id="how"></p>
<script>
var $=function(i){return document.getElementById(i)};
function num(v){return parseFloat(String(v).replace(",","."))||0}
function f(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f")+" FCFA"}
function up(n,s){return Math.ceil(n/s)*s}
function esc(x){return x.replace(/\\/g,"\\\\").replace(/"/g,'\\"')}
$("t").onchange=function(){var a=this.value=="a";$("A").className=a?"":"hid";$("X").className=a?"hid":""};
$("g").onclick=function(){
 var n=esc($("n").value.trim()),e=$("e").value.trim()||"📦";
 if(!n){$("out").value="Écris d'abord le nom du produit.";return}
 if($("t").value=="a"){
  var u=$("u").value.trim();
  if(!/^https:\/\//.test(u)){$("out").value="Colle ton lien affilié Amazon (https://...).";return}
  var d=esc($("d").value.trim());
  $("out").value='{n:"'+n+'"'+(d?',d:"'+d+'"':'')+',e:"'+e+'",u:"'+u+'"'+'},';
  $("how").textContent="Colle cette ligne dans la liste AMZ de index.html (avant le ]). Photo : enregistre-la sous amz1.jpg, amz2.jpg… dans l'ordre de la liste.";
 }else{
  var cost=num($("usd").value)*num($("fx").value)+num($("fr").value);
  if(!cost){$("out").value="Entre le prix d'achat.";return}
  var pv=up(cost*(1+num($("m").value)/100),500)-10;
  var old=$("pro").checked?up(pv*1.25,500):0;
  $("calc").textContent="Coût "+f(Math.round(cost))+" → vente "+f(pv)+" → marge "+f(Math.round(pv-cost));
  $("out").value='['+$("id").value+',"'+n+'",'+$("c").value+','+pv+','+old+',"'+e+'",[]],';
  $("how").textContent="Colle cette ligne dans la liste P de index.html, après la dernière ligne (n'oublie pas la virgule de la ligne d'avant). Photo : "+$("id").value+".jpg.";
 }};
$("cp").onclick=function(){var o=$("out");o.select();try{navigator.clipboard.writeText(o.value)}catch(x){document.execCommand("copy")}this.textContent="Copié ✓";var b=this;setTimeout(function(){b.textContent="Copier"},1500)};
</script></body></html>
